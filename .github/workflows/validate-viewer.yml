name: Validate Viewer

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build viewer assets
        run: node scripts/build-published-viewer.mjs

      - name: Validate generated viewer assets
        run: node scripts/validate-published-viewer.mjs
